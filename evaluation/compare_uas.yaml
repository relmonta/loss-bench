variable: uas
evaluator_kwargs:
  # Evaluation period
  start_date: "2015-01-01"
  end_date: "2023-12-31"
  # Period to use in temporal evolution plot
  start_date_plot: "2022-11-01"
  end_date_plot: "2022-12-31"
  # metrics to show in the radar plot
  metrics:
    - mae
    - mse
    - spectral
    - dssim
    - gdl
  overwrite: false  # Whether to overwrite existing results
  figformat: "png"  # "pdf", "png", "svg", etc.

comparisons:
  dwt_vs_dtcwt:
    - mae
    - wavelet
    - wavelet_complex
  mae_mse_dssim_wavelet:
    - mse
    - mae
    - dssim
    - wavelet
    - wavelet_complex
  combo_mae_plus:
    - mae
    - combo_mae_dssim
    - combo_mae_spectral
    - combo_mae_wavelet
    - combo_mae_gdl  
  combo_fmae_plus:
    - mae
    - combo_fmae_dssim
    - combo_fmae_spectral
    - combo_fmae_wavelet
    - combo_fmae_gdl
  combo_of_three:
    - mae
    - combo_mae_dssim_spectral
    - combo_mae_spectral_wavelet
    - combo_fmae_spectral_wavelet    
    - combo_mae_wavelet_gdl
    - combo_mae_gdl_spectral
    - combo_mae_dssim_wavelet
    - combo_mae_dssim_gdl                                   
  best_of_extremes: 
    - combo_fmae_spectral
    - combo_fmae_wavelet  
    - combo_fmae_spectral_wavelet
    - combo_mae_wavelet      
    - combo_mae_dssim_wavelet
    - mae
  best_of: 
    - mae
    - combo_mae_dssim_spectral
    - combo_mae_dssim_wavelet
    - combo_mae_dssim              
  best_visually: 
    - combo_fmae_spectral
    - combo_mae_spectral
    - combo_mae_dssim_spectral
    - combo_mae_spectral_wavelet
    - combo_fmae_spectral_wavelet
    - combo_mae_gdl_spectral
    - combo_mae_dssim
    - mae
  best_visually_reduced:
    - combo_fmae_spectral
    - combo_mae_spectral
    - combo_fmae_spectral_wavelet
    - combo_mae_dssim_wavelet
    - mae
  # Name the comparison and set the losses to compare
  # comparison_name:
    # - loss1
    # - loss2
    # - loss3
    # - ...